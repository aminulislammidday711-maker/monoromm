<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Brain Exercises — Monorom Memory Companion</title>

<style>
  /* ============================================================
     Palette matched to the Monorom Memory Companion light home screen:
     warm cream background, white panels, deep text, soft gold
     accent for the primary action. Large text and big tap targets
     throughout for elderly / low-vision users.
     ============================================================ */
  :root{
    --bg-light:   #f4f1e8;
    --bg-panel:   #ffffff;
    --brand:      #2f6b4f;
    --brand-2:    #3f8a63;
    --card:       #ffffff;
    --card-text:  #1c2a20;
    --muted:      #5c665e;
    --gold:       #f2a93b;
    --danger:     #d1483a;
    --radius-lg:  22px;
    --radius-md:  14px;
    --shadow:     0 10px 26px rgba(0,0,0,0.06);
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0; padding:0; min-height:100%;
    font-family: 'Segoe UI', 'Poppins', system-ui, -apple-system, sans-serif;
    background: var(--bg-light);
    color: var(--card-text);
  }

  body{
    background-image:
      linear-gradient(rgba(244,241,232,0.09), rgba(244,241,232,0.09)),
      url('background.png');
    background-size: cover, cover;
    background-position: center, center;
    background-repeat: no-repeat, no-repeat;
    background-attachment: fixed, fixed;
  }

  /* ---------------- top bar ---------------- */
  .topbar{
    display:flex; align-items:center; gap:14px;
    padding: 22px 26px;
    background-color: var(--bg-panel);
    background-image:
      linear-gradient(rgba(255,255,255,0.1), rgba(255,255,255,0.1)),
      url('header.png');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    border-bottom: 2px solid rgba(0,0,0,0.06);
    box-shadow: 0 2px 8px rgba(0,0,0,0.03);
  }
  .back-btn{
    display:flex; align-items:center; justify-content:center;
    width:48px; height:48px; border-radius:50%;
    background: rgba(0,0,0,0.05);
    color: var(--card-text); text-decoration:none; font-size:1.5rem;
    border: 2px solid rgba(0,0,0,0.1);
    flex-shrink:0;
  }
  .back-btn:active{ background: rgba(0,0,0,0.12); }

  .topbar-titles{ flex:1; min-width:0; }
  .eyebrow{
    text-transform:uppercase; letter-spacing:1.5px;
    font-size:0.75rem; font-weight:700; color: var(--brand);
    margin:0 0 4px;
  }
  .page-title{ margin:0; font-size: clamp(1.4rem, 5vw, 1.9rem); font-weight:800; color: var(--card-text); }

  /* ---------------- intro strip ---------------- */
  .intro{
    max-width: 900px; margin: 22px auto 6px; padding: 0 22px;
    font-size: clamp(1rem, 3vw, 1.15rem); color: var(--muted); line-height:1.5;
  }

  /* ---------------- game grid ---------------- */
  .grid-wrap{ max-width: 980px; margin: 0 auto; padding: 18px 22px 60px; }
  .game-grid{
    display:grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 22px;
  }

  .game-card{
    background: var(--card);
    color: var(--card-text);
    border-radius: var(--radius-lg);
    padding: 20px;
    display:flex; flex-direction:column; align-items:center;
    text-align:center;
    text-decoration:none;
    box-shadow: var(--shadow);
    border: 3px solid transparent;
    transition: transform .15s ease, border-color .15s ease;
    cursor:pointer;
  }
  .game-card:hover, .game-card:focus-visible{
    transform: translateY(-4px);
    border-color: var(--gold);
    outline:none;
  }
  .game-card:active{ transform: translateY(-1px) scale(0.98); }

  .game-icon-wrap{
    width: 120px; height: 120px;
    border-radius: var(--radius-md);
    overflow:hidden;
    background: var(--brand);
    display:flex; align-items:center; justify-content:center;
    margin-bottom: 16px;
    border: 3px solid rgba(0,0,0,0.08);
  }
  .game-icon-wrap img{
    width:100%; height:100%; object-fit:cover; display:block;
  }
  .game-icon-wrap svg{ width:56px; height:56px; }

  .game-name{
    font-size: 1.25rem; font-weight:800; margin: 0 0 6px; color: var(--card-text);
  }
  .game-desc{
    font-size: 0.95rem; color: var(--muted); margin:0 0 16px; line-height:1.4;
  }

  .play-pill{
    margin-top:auto;
    padding: 10px 26px;
    border-radius: 999px;
    background: var(--brand);
    color:#fff; font-weight:800; font-size:1rem;
    letter-spacing: 0.3px;
  }
  .game-card:hover .play-pill{ background: var(--brand-2); }

  /* placeholder tag for games still in progress */
  .badge-soon{
    position:relative; top:-4px;
    font-size:0.68rem; font-weight:800; text-transform:uppercase;
    letter-spacing:0.6px; color:#fff; background: var(--danger);
    padding: 3px 9px; border-radius: 999px; margin-bottom:8px;
  }

  @media (prefers-reduced-motion: reduce){
    .game-card{ transition:none; }
  }
</style>

<script src="api-config.js"></script>
<script src="monorom-core.js"></script>
<script src="monorom-language.js"></script>
</head>
<body>

  <div class="topbar">
    <a class="back-btn" href="index.html" aria-label="Back to home">←</a>
    <div class="topbar-titles">
      <p class="eyebrow" data-global-i18n="assistedCare">Assisted Care Platform</p>
      <h1 class="page-title" data-global-i18n="brainExercises">Brain Exercises</h1>
    </div>
  </div>

  <p class="intro" data-global-i18n="brainIntro">Choose a game below to begin. Each one is gentle, calm, and designed to help with memory and focus — take your time.</p>

  <div class="grid-wrap">
    <div class="game-grid" id="gameGrid"></div>
  </div>

<script>
  /* =====================================================================
     GAME CATALOG
     ===================================================================== */
  const GAME_I18N = {
    en: {
      assistedCare:"Assisted Care Platform", brainExercises:"Brain Exercises",
      brainIntro:"Choose a game below to begin. Each one is gentle, calm, and designed to help with memory and focus — take your time.",
      play:"Play",
      ballName:"Ball Sort Puzzle", ballDesc:"Sort the colourful balls into matching tubes.",
      snakeName:"Gentle Snake", snakeDesc:"A calm journey through the hills and rivers of the Northeast.",
      sisterName:"Seven Sister Seek", sisterDesc:"Explore and discover the beauty of the Seven Sister states.",
      voidName:"Void Breach", voidDesc:"An engaging 3D arcade challenge through the cosmic void."
    },
    bn: {
      assistedCare:"সহায়ক পরিচর্যা প্ল্যাটফর্ম", brainExercises:"মস্তিষ্কের ব্যায়াম",
      brainIntro:"শুরু করতে নিচের একটি খেলা বেছে নিন। প্রতিটি খেলা শান্ত ও সহজভাবে স্মৃতি ও মনোযোগে সহায়তা করার জন্য তৈরি — সময় নিয়ে খেলুন।",
      play:"খেলুন",
      ballName:"বল সাজানোর ধাঁধা", ballDesc:"রঙিন বলগুলো মিলিয়ে টিউবে সাজান।",
      snakeName:"শান্ত সাপ", snakeDesc:"উত্তর-পূর্বের পাহাড় ও নদীর মধ্য দিয়ে একটি শান্ত যাত্রা।",
      sisterName:"সেভেন সিস্টার সিক", sisterDesc:"সেভেন সিস্টার রাজ্যগুলোর সৌন্দর্য আবিষ্কার করুন।",
      voidName:"ভয়েড ব্রিচ", voidDesc:"মহাশূন্যের মধ্য দিয়ে একটি আকর্ষণীয় 3D আর্কেড চ্যালেঞ্জ।"
    },
    hi: {
      assistedCare:"सहायता देखभाल प्लेटफ़ॉर्म", brainExercises:"मस्तिष्क अभ्यास",
      brainIntro:"शुरू करने के लिए नीचे एक गेम चुनें। हर गेम स्मृति और ध्यान में मदद करने के लिए शांत और सरल बनाया गया है — अपना समय लें।",
      play:"खेलें",
      ballName:"बॉल सॉर्ट पहेली", ballDesc:"रंगीन गेंदों को मिलान वाली ट्यूबों में सजाएँ।",
      snakeName:"शांत साँप", snakeDesc:"पूर्वोत्तर की पहाड़ियों और नदियों के बीच एक शांत यात्रा।",
      sisterName:"सेवन सिस्टर सीक", sisterDesc:"सेवन सिस्टर राज्यों की सुंदरता खोजें।",
      voidName:"वॉइड ब्रीच", voidDesc:"अंतरिक्ष के बीच एक रोचक 3D आर्केड चुनौती।"
    },
    as: {
      assistedCare:"সহায়ক যত্ন প্লেটফৰ্ম", brainExercises:"মগজুৰ অনুশীলন",
      brainIntro:"আৰম্ভ কৰিবলৈ তলৰ এটা খেল বাছক। প্ৰতিটো খেল স্মৃতি আৰু মনোযোগত সহায় কৰিবলৈ শান্ত আৰু সহজভাৱে তৈয়াৰ কৰা হৈছে — সময় লৈ খেলক।",
      play:"খেলক",
      ballName:"বল সজোৱা ধাঁধা", ballDesc:"ৰঙীন বলবোৰ মিল থকা টিউবত সজাওক।",
      snakeName:"শান্ত সাপ", snakeDesc:"উত্তৰ-পূবৰ পাহাৰ আৰু নদীৰ মাজেৰে এক শান্ত যাত্ৰা।",
      sisterName:"ছেভেন ছিষ্টাৰ ছিক", sisterDesc:"ছেভেন ছিষ্টাৰ ৰাজ্যসমূহৰ সৌন্দৰ্য আৱিষ্কাৰ কৰক।",
      voidName:"ভইড ব্ৰিচ", voidDesc:"মহাকাশৰ মাজেৰে এক আকৰ্ষণীয় 3D আৰ্কেড চেলেঞ্জ।"
    }
  };
  let currentLang = localStorage.getItem("monorom_lang") || "en";
  const GAMES = [
    {id:"ball_sort",key:"ball",logo:"Game logo/ball_sort_logo.jpg",link:"ball_sort/ball_sort_puzzle.html"},
    {id:"gentle_snake",key:"snake",logo:"Game logo/grntle_snake_logo.jpg",link:"gentle_snake/gentle_snake.html"},
    {id:"seven_sister",key:"sister",logo:"Game logo/seven_sister_logo.jpg",link:"Seven_sister/seven_sisters_seek.html"},
    {id:"void_breach",key:"void",logo:"Game logo/void_breach_logo.jpg",link:"void_breach/void_breach.html"}
  ];

  const genericIconSVG = `
    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect x="2" y="7" width="20" height="10" rx="5" fill="#ffffff" fill-opacity="0.18"/>
      <circle cx="8" cy="12" r="1.6" fill="#ffffff"/>
      <circle cx="6" cy="12" r="1.6" fill="#ffffff" opacity="0"/>
      <path d="M6.5 12h3M8 10.5v3" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round"/>
      <circle cx="16" cy="10.5" r="1.3" fill="#ffffff"/>
      <circle cx="18.2" cy="12.8" r="1.3" fill="#ffffff"/>
    </svg>`;

  const grid = document.getElementById("gameGrid");
  function renderGames(){
    const t = GAME_I18N[currentLang] || GAME_I18N.en;
    grid.innerHTML = "";
    GAMES.forEach(game => {
      const card = document.createElement("a");
      card.className = "game-card";
      card.href = game.link;
      card.setAttribute("aria-label", t.play + " " + t[game.key+"Name"]);
      const iconHTML = game.logo ? `<img src="${game.logo}" alt="${t[game.key+"Name"]} icon">` : genericIconSVG;
      card.innerHTML = `<div class="game-icon-wrap">${iconHTML}</div><h2 class="game-name">${t[game.key+"Name"]}</h2><p class="game-desc">${t[game.key+"Desc"]}</p><span class="play-pill">${t.play}</span>`;
      grid.appendChild(card);
    });
    document.querySelector('[data-global-i18n="assistedCare"]').textContent=t.assistedCare;
    document.querySelector('[data-global-i18n="brainExercises"]').textContent=t.brainExercises;
    document.querySelector('[data-global-i18n="brainIntro"]').textContent=t.brainIntro;
  }
  window.setLanguage = function(lang){ currentLang=GAME_I18N[lang]?lang:"en"; localStorage.setItem("monorom_lang",currentLang); renderGames(); };
  renderGames();
</script>
</body>
</html>
