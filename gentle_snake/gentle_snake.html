<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Gentle Snake — A Northeast India Journey</title>

<!-- Three.js from CDN -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<style>
  :root{
    --sun:        #E8935B;
    --hill:       #2F4A3C;
    --hill-light: #4C6B54;
    --river:      #5FA0C4;
    --mist:       #F6EEDD;
    --bamboo:     #7C5A3A;
    --gold:       #D9A441;
    --ink:        #23291F;
    --danger:     #C24A3E;
    --safe:       #5A8F5A;
    --radius-lg:  28px;
    --radius-md:  16px;
    --shadow-soft: 0 12px 30px rgba(35,41,31,0.28);
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }

  html,body{
    margin:0; padding:0; width:100%; height:100%;
    overflow:hidden;
    font-family: 'Segoe UI', 'Poppins', system-ui, -apple-system, sans-serif;
    background: linear-gradient(180deg, #F6EEDD 0%, #EADFC4 100%);
    color: var(--ink);
    -webkit-user-select:none; user-select:none;
  }

  #app{ position:relative; width:100vw; height:100vh; }

  .i18n-fade{ transition: opacity 0.28s ease; }
  .i18n-fade.fading{ opacity:0; }

  /* =================== SCREEN: START MENU =================== */
  #startScreen{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    z-index:30;
    background: url('gentle_snake.jpg') no-repeat center center;
    background-size: cover;
    overflow:hidden;
  }

  .start-card{
    position:relative; z-index:2;
    background: rgba(246, 238, 221, 0.92);
    border: 3px solid var(--hill);
    border-radius: var(--radius-lg);
    padding: 34px 30px 28px;
    max-width: 460px; width:88%;
    text-align:center;
    box-shadow: var(--shadow-soft);
    backdrop-filter: blur(3px);
  }

  .brand-title{
    margin:0 0 4px; font-size: clamp(2rem, 6.5vw, 2.6rem);
    font-weight:800; color: var(--hill);
    letter-spacing: 0.5px;
  }

  .brand-subtitle{
    margin: 0 0 20px; font-size: clamp(0.95rem, 3.4vw, 1.1rem);
    color:#5A5340; line-height:1.4; font-weight:500;
  }

  .lang-picker{
    position: relative;
    display:inline-block;
    margin-bottom: 20px;
  }
  .lang-select-btn{
    padding: 10px 22px; font-size: 0.95rem; font-weight: 700;
    border-radius: 999px; border: 2px solid var(--hill);
    background: #fff; color: var(--hill); cursor: pointer;
    display: flex; align-items: center; gap: 8px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.06);
    transition: all .18s ease;
  }
  .lang-select-btn:hover { background: var(--hill); color: #fff; }
  .lang-dropdown{
    position: absolute; top: calc(100% + 6px); left: 50%;
    transform: translateX(-50%) scale(0.95);
    background: rgba(246, 238, 221, 0.98);
    border: 2px solid var(--hill); border-radius: 14px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.15);
    display: none; flex-direction: column; gap: 4px;
    padding: 6px; z-index: 20; min-width: 130px;
    opacity: 0; transition: all 0.15s ease;
  }
  .lang-dropdown.show{
    display: flex; opacity: 1; transform: translateX(-50%) scale(1);
  }
  .lang-btn{
    padding: 8px 14px; font-size: 0.9rem; font-weight: 700;
    border-radius: 8px; border: none; background: transparent;
    color: var(--hill); cursor: pointer; text-align: center;
    transition: all .12s ease;
  }
  .lang-btn.active, .lang-btn:hover{
    background: var(--hill); color: #fff;
  }

  .menu-audio-bar{
    display:flex; align-items:center; justify-content:center; gap:10px;
    margin-bottom: 20px; background: rgba(255,255,255,0.5);
    padding: 8px 14px; border-radius: 999px; border: 1.5px solid var(--hill);
  }
  .audio-ctrl-btn{
    background: rgba(246,238,221,0.95); border: 1.5px solid var(--hill);
    border-radius: 50%; width: 36px; height: 36px; font-weight:800;
    font-size: 0.95rem; color: var(--hill); cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .audio-ctrl-btn:active{ background: var(--hill); color:#fff; transform: scale(0.92); }
  .audio-label{ font-size:0.9rem; font-weight:800; color:var(--hill); min-width:65px; text-align:center; }

  .start-btn{
    padding: 18px 48px; font-size: clamp(1.2rem, 4vw, 1.4rem);
    font-weight: 800; color:#fff; border:none; border-radius:999px;
    background: linear-gradient(135deg, var(--sun), #D9743F);
    box-shadow: 0 10px 24px rgba(217,116,63,0.45);
    cursor:pointer; letter-spacing:0.5px;
    animation: pulseBtn 2.2s ease-in-out infinite;
  }
  .start-btn:active{ transform: scale(0.97); }
  @keyframes pulseBtn{
    0%,100%{ transform:scale(1); box-shadow: 0 10px 24px rgba(217,116,63,0.45); }
    50%{ transform:scale(1.045); box-shadow: 0 14px 32px rgba(217,116,63,0.65); }
  }
  @media (prefers-reduced-motion: reduce){
    .start-btn{ animation:none; }
  }

  /* =================== SCREEN: GAME =================== */
  #gameScreen{
    position:absolute; inset:0; display:none;
    flex-direction:column; align-items:center;
    z-index:10; background: linear-gradient(180deg,#DCE9EE 0%, #C7DCE3 100%);
  }

  #inGameTopBar{
    position:absolute; top:10px; left:10px; right:10px; z-index:15;
    display:flex; justify-content:space-between; align-items:center;
    pointer-events:none;
  }
  #inGameTopBar > * { pointer-events:auto; }

  #inGameLang{ display:flex; gap:5px; }
  #inGameLang button{
    font-size:0.75rem; font-weight:800; padding:4px 8px;
    border-radius:8px; border:1.5px solid var(--hill);
    background:rgba(246,238,221,0.9); color:var(--hill); cursor:pointer;
  }
  #inGameLang button.active{ background:var(--hill); color:#fff; }

  .top-right-group{ display:flex; gap:6px; align-items:center; }
  .in-game-audio-pill{
    display:flex; align-items:center; gap:4px; background:rgba(246,238,221,0.94);
    border:1.5px solid var(--hill); border-radius:999px; padding:2px 8px;
  }
  .mini-audio-btn{
    background:transparent; border:none; font-size:0.9rem; font-weight:900;
    color:var(--hill); cursor:pointer; padding:2px 5px;
  }
  .mini-audio-btn:active{ transform: scale(0.9); }

  #quitBtnGame{
    font-size:0.8rem; font-weight:800; padding:5px 12px;
    border-radius:8px; border:1.5px solid var(--danger);
    background:rgba(246,238,221,0.94); color:var(--danger); cursor:pointer;
    box-shadow: 0 2px 6px rgba(0,0,0,0.1);
  }
  #quitBtnGame:active{ background:var(--danger); color:#fff; }

  #hud{
    width:100%; max-width: 620px;
    display:flex; align-items:center; justify-content:space-between;
    padding: 44px 18px 6px; gap:8px; flex-wrap:wrap;
  }
  .hud-pill{
    background: rgba(246,238,221,0.94);
    border:2px solid var(--hill);
    border-radius: 999px;
    padding: 5px 12px;
    display:flex; align-items:center; gap:6px;
    font-weight:800; font-size: 0.9rem; color: var(--hill);
    box-shadow: 0 4px 10px rgba(0,0,0,0.12);
  }
  .hud-pill .val{ color: var(--danger); font-size:1rem; }
  #livesPill .val{ color: var(--safe); }
  #shieldPill{ display:none; }
  #shieldPill.show{ display:flex; }
  #shieldPill .val{ color: var(--gold); }

  #canvasWrap{
    position:relative;
    width: min(98vw, 720px); /* Enlarged playing area width */
    aspect-ratio: 1 / 1;
    border-radius: var(--radius-md);
    overflow:hidden;
    border: 4px solid var(--hill);
    box-shadow: var(--shadow-soft);
    margin-top: 2px;
    background:#12211a;
  }
  #canvasWrap canvas{ display:block; width:100%; height:100%; touch-action:none; }

  #damageFlash{
    position:absolute; inset:0; background: var(--danger);
    opacity:0; pointer-events:none; transition: opacity .12s ease;
  }
  #damageFlash.hit{ opacity:0.45; }

  #controlsHint{
    margin-top:6px; font-size:0.85rem; font-weight:700;
    color: var(--hill); text-align:center; padding:0 12px;
  }

  #dpad{
    display:grid;
    grid-template-columns: repeat(3, 54px);
    grid-template-rows: repeat(3, 54px);
    gap:5px; margin: 8px 0 12px;
  }
  .dbtn{
    background: rgba(246,238,221,0.95);
    border: 2px solid var(--hill);
    border-radius: 14px;
    color: var(--hill);
    font-size:1.3rem; font-weight:900;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; box-shadow: 0 4px 8px rgba(0,0,0,0.15);
  }
  .dbtn:active{ background: var(--hill); color:#fff; transform: scale(0.94); }
  .dbtn.up{ grid-column:2; grid-row:1; }
  .dbtn.left{ grid-column:1; grid-row:2; }
  .dbtn.mid{ grid-column:2; grid-row:2; visibility:hidden; }
  .dbtn.right{ grid-column:3; grid-row:2; }
  .dbtn.down{ grid-column:2; grid-row:3; }

  #gameOverOverlay{
    position:absolute; inset:0; z-index:40;
    display:none; align-items:center; justify-content:center;
    background: rgba(20, 26, 18, 0.72);
  }
  .go-card{
    background: var(--mist); border:3px solid var(--gold);
    border-radius: var(--radius-lg); padding: 28px 24px;
    text-align:center; max-width: 380px; width:86%;
    box-shadow: var(--shadow-soft);
  }
  .go-title{ font-size: clamp(1.5rem,5vw,1.9rem); font-weight:800; color: var(--danger); margin:0 0 10px; }
  .go-score-label{ font-size:1rem; font-weight:700; color:#5A5340; margin-bottom:2px; }
  .go-score-val{ font-size: 2.2rem; font-weight:900; color: var(--hill); margin-bottom: 16px; }
  
  .btn-group{
    display:flex; flex-direction:column; gap:8px; align-items:center;
  }
  .action-btn{
    width: 100%; max-width: 240px;
    padding: 12px 20px; font-size:1.05rem; font-weight:800; color:#fff;
    border:none; border-radius:999px; cursor:pointer;
    box-shadow: 0 6px 16px rgba(0,0,0,0.2);
  }
  .action-btn:active{ transform: scale(0.97); }
  .btn-primary{ background: linear-gradient(135deg, var(--hill), var(--hill-light)); }
  .btn-secondary{ background: linear-gradient(135deg, var(--danger), #A33A30); }
</style>

<script src="../api-config.js"></script>
<script src="../monorom-core.js"></script>
<script src="../monorom-language.js"></script>
</head>
<body>
<div id="app">

  <!-- ======================= START SCREEN ======================= -->
  <div id="startScreen">
    <div class="start-card i18n-fade">
      <h1 class="brand-title" data-i18n="appTitle">Gentle Snake</h1>
      <p class="brand-subtitle" data-i18n="appSubtitle">A calm journey through the hills and rivers of the Northeast</p>

      <div class="lang-picker" role="group" aria-label="Language">
        <button class="lang-select-btn" id="langSelectToggle">
          <span id="currentLangLabel">English</span> ▾
        </button>
        <div class="lang-dropdown" id="langDropdown">
          <button class="lang-btn active" data-lang="en">English</button>
          <button class="lang-btn" data-lang="hi">हिन्दी</button>
          <button class="lang-btn" data-lang="bn">বাংলা</button>
          <button class="lang-btn" data-lang="as">অসমীয়া</button>
        </div>
      </div>

      <div class="menu-audio-bar">
        <button class="audio-ctrl-btn" id="menuVolDownBtn">-</button>
        <button class="audio-ctrl-btn" id="menuMuteBtn">🔊</button>
        <button class="audio-ctrl-btn" id="menuVolUpBtn">+</button>
        <span class="audio-label" id="menuVolLabel">50%</span>
      </div>

      <button class="start-btn" id="startBtn" data-i18n="startBtn">Start Game</button>
    </div>
  </div>

  <!-- ======================= GAME SCREEN ======================= -->
  <div id="gameScreen">
    <div id="inGameTopBar">
      <div id="inGameLang">
        <button data-lang="en" class="active">EN</button>
        <button data-lang="hi">HI</button>
        <button data-lang="bn">BN</button>
        <button data-lang="as">AS</button>
      </div>
      <div class="top-right-group">
        <div class="in-game-audio-pill">
          <button class="mini-audio-btn" id="gameVolDownBtn">-</button>
          <button class="mini-audio-btn" id="gameMuteBtn">🔊</button>
          <button class="mini-audio-btn" id="gameVolUpBtn">+</button>
        </div>
        <button id="quitBtnGame" data-i18n="quitBtn">Quit</button>
      </div>
    </div>

    <div id="hud" class="i18n-fade">
      <div class="hud-pill"><span data-i18n="scoreLabel">Score</span>:&nbsp;<span class="val" id="scoreVal">0</span></div>
      <div class="hud-pill"><span data-i18n="speedLabel">Speed</span>:&nbsp;<span class="val" id="speedVal">1</span></div>
      <div class="hud-pill" id="livesPill"><span data-i18n="livesLabel">Lives</span>:&nbsp;<span class="val" id="livesVal">0</span></div>
      <div class="hud-pill" id="shieldPill"><span data-i18n="shieldLabel">Shield</span>:&nbsp;<span class="val" id="shieldVal">0</span>s</div>
    </div>

    <div id="canvasWrap">
      <canvas id="gameCanvas"></canvas>
      <div id="damageFlash"></div>
    </div>

    <p id="controlsHint" class="i18n-fade" data-i18n="controlsHint">Use the arrows or swipe to guide the snake</p>

    <div id="dpad">
      <button class="dbtn up" data-dir="up">▲</button>
      <button class="dbtn left" data-dir="left">◀️</button>
      <button class="dbtn mid"></button>
      <button class="dbtn right" data-dir="right">▶️</button>
      <button class="dbtn down" data-dir="down">▼</button>
    </div>
  </div>

  <!-- ======================= GAME OVER OVERLAY ======================= -->
  <div id="gameOverOverlay">
    <div class="go-card i18n-fade">
      <h2 class="go-title" data-i18n="gameOverTitle">Game Over</h2>
      <div class="go-score-label" data-i18n="finalScoreLabel">Your Score</div>
      <div class="go-score-val" id="finalScoreVal">0</div>
      
      <div class="btn-group">
        <button class="action-btn btn-primary" id="restartBtn" data-i18n="restartBtn">Play Again</button>
        <button class="action-btn btn-secondary" id="quitBtnGameOver" data-i18n="quitBtn">Main Menu</button>
      </div>
    </div>
  </div>

</div>

<script>
let audioCtx = null;
let masterGain = null;
let bgmInterval = null;
let currentVolume = 0.5;
let isMuted = false;

function initAudio(){
  if (audioCtx) return;
  const AudioContext = window.AudioContext || window.webkitAudioContext;
  if (!AudioContext) return;
  audioCtx = new AudioContext();

  masterGain = audioCtx.createGain();
  masterGain.gain.value = currentVolume;
  masterGain.connect(audioCtx.destination);

  startAmbientBGM();
}

const chordFrequencies = [
  [220.00, 329.63, 392.00],
  [196.00, 293.66, 349.23],
  [174.61, 261.63, 329.63],
  [220.00, 261.63, 392.00]
];

let chordIndex = 0;
function playAmbientChord(){
  if (!audioCtx || audioCtx.state !== 'running' || isMuted) return;

  const freqs = chordFrequencies[chordIndex];
  chordIndex = (chordIndex + 1) % chordFrequencies.length;

  freqs.forEach((freq, idx) => {
    const osc = audioCtx.createOscillator();
    const noteGain = audioCtx.createGain();
    const filter = audioCtx.createBiquadFilter();

    osc.type = idx === 0 ? 'sine' : 'triangle';
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(450, audioCtx.currentTime);

    const now = audioCtx.currentTime;
    noteGain.gain.setValueAtTime(0, now);
    noteGain.gain.linearRampToValueAtTime(0.045, now + 1.2);
    noteGain.gain.exponentialRampToValueAtTime(0.0001, now + 5.5);

    osc.connect(filter);
    filter.connect(noteGain);
    noteGain.connect(masterGain);

    osc.start(now);
    osc.stop(now + 5.8);
  });
}

function startAmbientBGM(){
  if (bgmInterval) return;
  playAmbientChord();
  bgmInterval = setInterval(playAmbientChord, 5000);
}

function updateVolumeDisplay(){
  const pct = Math.round(currentVolume * 100) + '%';
  document.getElementById('menuVolLabel').textContent = pct;
  const icon = isMuted || currentVolume === 0 ? '🔇' : '🔊';
  document.getElementById('menuMuteBtn').textContent = icon;
  document.getElementById('gameMuteBtn').textContent = icon;
}

function setVolume(vol){
  currentVolume = Math.max(0, Math.min(1, vol));
  if (currentVolume > 0) isMuted = false;
  if (masterGain && audioCtx) {
    masterGain.gain.setValueAtTime(isMuted ? 0 : currentVolume, audioCtx.currentTime);
  }
  updateVolumeDisplay();
}

function toggleMute(){
  isMuted = !isMuted;
  if (masterGain && audioCtx){
    masterGain.gain.setValueAtTime(isMuted ? 0 : currentVolume, audioCtx.currentTime);
  }
  updateVolumeDisplay();
}

document.getElementById('menuVolUpBtn').addEventListener('click', () => { initAudio(); setVolume(currentVolume + 0.1); });
document.getElementById('menuVolDownBtn').addEventListener('click', () => { initAudio(); setVolume(currentVolume - 0.1); });
document.getElementById('menuMuteBtn').addEventListener('click', () => { initAudio(); toggleMute(); });

document.getElementById('gameVolUpBtn').addEventListener('click', () => { initAudio(); setVolume(currentVolume + 0.1); });
document.getElementById('gameVolDownBtn').addEventListener('click', () => { initAudio(); setVolume(currentVolume - 0.1); });
document.getElementById('gameMuteBtn').addEventListener('click', () => { initAudio(); toggleMute(); });

const I18N = {
  en: {
    appTitle: "Gentle Snake",
    appSubtitle: "A calm journey through the hills and rivers of the Northeast",
    startBtn: "Start Game",
    scoreLabel: "Score",
    speedLabel: "Speed",
    livesLabel: "Lives",
    shieldLabel: "Shield",
    gameOverTitle: "Game Over",
    finalScoreLabel: "Your Score",
    restartBtn: "Play Again",
    quitBtn: "Quit",
    controlsHint: "Use the arrows or swipe to guide the snake"
  },
  hi: {
    appTitle: "सरल सांप",
    appSubtitle: "पूर्वोत्तर की पहाड़ियों और नदियों से होकर एक शांत यात्रा",
    startBtn: "खेल शुरू करें",
    scoreLabel: "स्कोर",
    speedLabel: "गति",
    livesLabel: "जीवन",
    shieldLabel: "कवच",
    gameOverTitle: "खेल समाप्त",
    finalScoreLabel: "आपका स्कोर",
    restartBtn: "फिर से खेलें",
    quitBtn: "छोड़ें",
    controlsHint: "सांप को चलाने के लिए तीर या स्वाइप का उपयोग करें"
  },
  bn: {
    appTitle: "শান্ত সাপ",
    appSubtitle: "উত্তর-পূর্বের পাহাড় ও নদীর মধ্য দিয়ে এক শান্ত যাত্রা",
    startBtn: "খেলা শুরু করুন",
    scoreLabel: "স্কোর",
    speedLabel: "গতি",
    livesLabel: "জীবন",
    shieldLabel: "ঢাল",
    gameOverTitle: "খেলা শেষ",
    finalScoreLabel: "আপনার স্কোর",
    restartBtn: "আবার খেলুন",
    quitBtn: "প্রস্থান",
    controlsHint: "সাপ চালাতে তীরচিহ্ন বা সোয়াইপ ব্যবহার করুন"
  },
  as: {
    appTitle: "শান্ত সাপ",
    appSubtitle: "উত্তৰ-পূৱৰ পাহাৰ আৰু নদীৰ মাজেৰে এক শান্ত যাত্ৰা",
    startBtn: "খেল আৰম্ভ কৰক",
    scoreLabel: "স্কোৰ",
    speedLabel: "গতি",
    livesLabel: "জীৱন",
    shieldLabel: "ঢাল",
    gameOverTitle: "খেল সমাপ্ত",
    finalScoreLabel: "আপোনাৰ স্কোৰ",
    restartBtn: "পুনৰ খেলক",
    quitBtn: "প্ৰস্থান",
    controlsHint: "সাপটো চলাবলৈ কাড়া বা সোৱাইপ ব্যৱহাৰ কৰক"
  }
};

let currentLang = "en";

function applyLanguage(lang){
  currentLang = lang;
  const dict = I18N[lang];
  const containers = document.querySelectorAll(".i18n-fade");
  containers.forEach(c => c.classList.add("fading"));

  setTimeout(() => {
    document.querySelectorAll("[data-i18n]").forEach(el => {
      const key = el.getAttribute("data-i18n");
      if (dict[key]) el.textContent = dict[key];
    });
    containers.forEach(c => c.classList.remove("fading"));
  }, 220);

  const activeBtn = document.querySelector(`.lang-btn[data-lang="${lang}"]`);
  if (activeBtn) {
    document.getElementById('currentLangLabel').textContent = activeBtn.textContent;
  }

  document.querySelectorAll(".lang-btn, #inGameLang button").forEach(b=>{
    b.classList.toggle("active", b.getAttribute("data-lang") === lang);
  });
}

const langToggleBtn = document.getElementById('langSelectToggle');
const langDropdown = document.getElementById('langDropdown');

langToggleBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  langDropdown.classList.toggle('show');
});

document.addEventListener('click', () => {
  langDropdown.classList.remove('show');
});

document.querySelectorAll(".lang-btn, #inGameLang button").forEach(btn=>{
  btn.addEventListener("click", (e) => {
    e.stopPropagation();
    applyLanguage(btn.getAttribute("data-lang"));
    langDropdown.classList.remove('show');
  });
});

const GRID_SIZE   = 15;     
const CELL        = 1.4;    
const HALF        = (GRID_SIZE * CELL) / 2;

const START_INTERVAL = 480;  
const MIN_INTERVAL   = 190;  
const INTERVAL_STEP  = 12;   

const NUM_OBSTACLES  = 9;
const SHIELD_MS      = 8000; 

function gx(x){ return (x - (GRID_SIZE-1)/2) * CELL; }
function gz(z){ return (z - (GRID_SIZE-1)/2) * CELL; }

const canvas = document.getElementById("gameCanvas");
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, alpha:false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a2e24);

const camera = new THREE.OrthographicCamera(
  -HALF * 1.15, HALF * 1.15,
  HALF * 1.15, -HALF * 1.15,
  0.1, 100
);
function positionCamera(){
  camera.position.set(0, 25, 0);
  camera.lookAt(0, 0, 0);
  camera.rotation.z = 0;
}
positionCamera();

scene.add(new THREE.AmbientLight(0xffffff, 1.0));

const groundGeo = new THREE.PlaneGeometry(GRID_SIZE*CELL, GRID_SIZE*CELL, 1, 1);
const groundMat = new THREE.MeshBasicMaterial({ color: 0x3c6b45 });
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI/2;
scene.add(ground);

const gridHelper = new THREE.GridHelper(GRID_SIZE*CELL, GRID_SIZE, 0x2f4a30, 0x2f4a30);
gridHelper.material.opacity = 0.35;
gridHelper.material.transparent = true;
gridHelper.position.y = 0.01;
scene.add(gridHelper);

let snake = [], obstacles = [], foodItems = [], meshPool = [];
let direction = { dx:1, dz:0 }, queuedDirection = { dx:1, dz:0 };
let moveInterval = START_INTERVAL, moveAccumulator = 0;
let score = 0, lives = 0, shieldActive = false, shieldTimer = 0, growthPending = 0;
let gameRunning = false;
let clock = new THREE.Clock();

const snakeGroup = new THREE.Group(); scene.add(snakeGroup);
const obstacleGroup = new THREE.Group(); scene.add(obstacleGroup);
const foodGroup = new THREE.Group(); scene.add(foodGroup);

const headMat   = new THREE.MeshBasicMaterial({ color: 0x4caf50 });
const bodyMat   = new THREE.MeshBasicMaterial({ color: 0x5fbf63 });
const shieldGlowMat = new THREE.MeshBasicMaterial({ color: 0xffe066 });
const rockMat   = new THREE.MeshBasicMaterial({ color: 0x8a8578 });
const logMat    = new THREE.MeshBasicMaterial({ color: 0x6b4a2c });
const appleMat  = new THREE.MeshBasicMaterial({ color: 0xd9432f });
const heartMat  = new THREE.MeshBasicMaterial({ color: 0xe8547a });
const shieldItemMat = new THREE.MeshBasicMaterial({ color: 0x4fc3f7 });

function makeIconSprite(emoji){
  const c = document.createElement('canvas'); c.width=64; c.height=64;
  const cx = c.getContext('2d');
  cx.font = "44px sans-serif"; cx.textAlign="center"; cx.textBaseline="middle";
  cx.fillText(emoji, 32, 36);
  const tex = new THREE.CanvasTexture(c);
  const mat = new THREE.SpriteMaterial({ map: tex, depthWrite:false });
  const sprite = new THREE.Sprite(mat);
  sprite.scale.set(0.8,0.8,0.8);
  sprite.position.y = 0.55;
  return sprite;
}

function cellFree(x, z){
  if (obstacles.some(o=>o.x===x && o.z===z)) return false;
  if (snake && snake.some(s=>s.x===x && s.z===z)) return false;
  if (foodItems && foodItems.some(f=>f.x===x && f.z===z)) return false;
  return true;
}

function randomCell(){
  return { x: Math.floor(Math.random()*GRID_SIZE), z: Math.floor(Math.random()*GRID_SIZE) };
}

function buildObstacles(){
  obstacleGroup.clear();
  obstacles = [];
  const centerMin = GRID_SIZE/2 - 3, centerMax = GRID_SIZE/2 + 3;
  while(obstacles.length < NUM_OBSTACLES){
    const c = randomCell();
    if (c.x > centerMin && c.x < centerMax && c.z > centerMin && c.z < centerMax) continue;
    if (obstacles.some(o=>o.x===c.x && o.z===c.z)) continue;
    obstacles.push(c);

    const isRock = Math.random() < 0.6;
    let mesh = isRock ? 
      new THREE.Mesh(new THREE.CircleGeometry(0.45, 8), rockMat) :
      new THREE.Mesh(new THREE.PlaneGeometry(0.9, 0.4), logMat);
    mesh.rotation.x = -Math.PI/2;
    mesh.position.set(gx(c.x), 0.03, gz(c.z));
    obstacleGroup.add(mesh);
  }
}

function spawnFoodItem(type){
  let c;
  do { c = randomCell(); } while(!cellFree(c.x, c.z));
  let mesh;
  if (type === 'apple'){
    mesh = new THREE.Mesh(new THREE.CircleGeometry(0.38, 12), appleMat);
  } else if (type === 'heart'){
    mesh = new THREE.Mesh(new THREE.CircleGeometry(0.35, 4), heartMat);
    mesh.add(makeIconSprite('❤️'));
  } else { 
    mesh = new THREE.Mesh(new THREE.CircleGeometry(0.35, 6), shieldItemMat);
    mesh.add(makeIconSprite('🛡️'));
  }
  mesh.rotation.x = -Math.PI/2;
  mesh.position.set(gx(c.x), 0.04, gz(c.z));
  foodGroup.add(mesh);
  foodItems.push({ x:c.x, z:c.z, type, mesh });
}

function ensureApple(){
  if (!foodItems.some(f=>f.type==='apple')) spawnFoodItem('apple');
}

function respawnSnake(){
  snakeGroup.clear();
  const startX = Math.floor(GRID_SIZE/2), startZ = Math.floor(GRID_SIZE/2);
  const currentLen = Math.max(3, snake.length);
  snake = [];
  for(let i=0; i<currentLen; i++){
    snake.push({ x: startX - i, z: startZ });
  }
  meshPool = snake.map((s,i)=>{
    const m = new THREE.Mesh(new THREE.PlaneGeometry(CELL*0.85, CELL*0.85), i===0?headMat:bodyMat);
    m.rotation.x = -Math.PI/2;
    m.position.set(gx(s.x), 0.05, gz(s.z));
    snakeGroup.add(m);
    return m;
  });
  direction = { dx:1, dz:0 };
  queuedDirection = { dx:1, dz:0 };
  growthPending = 0;
  captureSnapshot();
}

function resetGame(){
  snakeGroup.clear();
  const startX = Math.floor(GRID_SIZE/2), startZ = Math.floor(GRID_SIZE/2);
  snake = [
    { x:startX,   z:startZ },
    { x:startX-1, z:startZ },
    { x:startX-2, z:startZ }
  ];
  meshPool = snake.map((s,i)=>{
    const m = new THREE.Mesh(new THREE.PlaneGeometry(CELL*0.85, CELL*0.85), i===0?headMat:bodyMat);
    m.rotation.x = -Math.PI/2;
    m.position.set(gx(s.x), 0.05, gz(s.z));
    snakeGroup.add(m);
    return m;
  });
  direction = { dx:1, dz:0 };
  queuedDirection = { dx:1, dz:0 };
  growthPending = 0;

  foodGroup.clear();
  foodItems = [];
  buildObstacles();
  ensureApple();

  score = 0; lives = 0; shieldActive = false; shieldTimer = 0;
  moveInterval = START_INTERVAL; moveAccumulator = 0;
  updateHUD();

  document.getElementById('gameOverOverlay').style.display = 'none';
  gameRunning = true;
  captureSnapshot();
}

function returnToMainScreen(){
  gameRunning = false;
  document.getElementById('gameOverOverlay').style.display = 'none';
  document.getElementById('gameScreen').style.display = 'none';
  document.getElementById('startScreen').style.display = 'flex';
}

function updateHUD(){
  document.getElementById('scoreVal').textContent = score;
  const speedLevel = Math.round(((START_INTERVAL - moveInterval) / (START_INTERVAL - MIN_INTERVAL)) * 9) + 1;
  document.getElementById('speedVal').textContent = speedLevel;
  document.getElementById('livesVal').textContent = lives;
  const shieldPill = document.getElementById('shieldPill');
  if (shieldActive){
    shieldPill.classList.add('show');
    document.getElementById('shieldVal').textContent = Math.ceil(shieldTimer/1000);
  } else {
    shieldPill.classList.remove('show');
  }
}

function flashDamage(){
  const el = document.getElementById('damageFlash');
  el.classList.add('hit');
  setTimeout(()=>el.classList.remove('hit'), 160);
}

function setDirection(dir){
  const map = {
    up:    { dx:0,  dz:-1 },
    down:  { dx:0,  dz:1  },
    left:  { dx:-1, dz:0  },
    right: { dx:1,  dz:0  }
  };
  const next = map[dir];
  if (!next) return;
  if (next.dx === -direction.dx && next.dz === -direction.dz) return;
  queuedDirection = next;
}

document.addEventListener('keydown', (e)=>{
  if (!gameRunning) return;
  if (e.key === 'ArrowUp' || e.key === 'w')    { setDirection('up'); e.preventDefault(); }
  else if (e.key === 'ArrowDown' || e.key === 's')  { setDirection('down'); e.preventDefault(); }
  else if (e.key === 'ArrowLeft' || e.key === 'a')  { setDirection('left'); e.preventDefault(); }
  else if (e.key === 'ArrowRight' || e.key === 'd') { setDirection('right'); e.preventDefault(); }
});

document.querySelectorAll('.dbtn[data-dir]').forEach(btn=>{
  const triggerDir = (e) => {
    e.preventDefault();
    setDirection(btn.getAttribute('data-dir'));
  };
  btn.addEventListener('pointerdown', triggerDir);
});

let touchStartX=0, touchStartY=0;
canvas.addEventListener('touchstart', (e)=>{
  const t = e.changedTouches[0];
  touchStartX = t.clientX; touchStartY = t.clientY;
}, { passive:true });
canvas.addEventListener('touchend', (e)=>{
  const t = e.changedTouches[0];
  const dx = t.clientX - touchStartX, dy = t.clientY - touchStartY;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) return; 
  if (Math.abs(dx) > Math.abs(dy)) setDirection(dx>0 ? 'right':'left');
  else setDirection(dy>0 ? 'down':'up');
}, { passive:true });

function stepGrid(){
  direction = queuedDirection;
  const head = snake[0];
  const newHead = { x: head.x + direction.dx, z: head.z + direction.dz };

  const hitsWall = newHead.x < 0 || newHead.x >= GRID_SIZE || newHead.z < 0 || newHead.z >= GRID_SIZE;
  const hitsObstacle = !hitsWall && obstacles.some(o=>o.x===newHead.x && o.z===newHead.z);
  const willEatTail = growthPending>0; 
  const bodyToCheck = willEatTail ? snake : snake.slice(0, snake.length-1);
  const hitsSelf = !hitsWall && bodyToCheck.some(s=>s.x===newHead.x && s.z===newHead.z);

  const collided = hitsWall || hitsObstacle || hitsSelf;

  if (collided){
    if (shieldActive){
      // shielded
    } else if (lives > 0){
      lives--;
      flashDamage();
      respawnSnake();
      updateHUD();
      return;
    } else {
      endGame();
      return;
    }
  }

  snake.unshift(newHead);
  if (growthPending>0){ growthPending--; }
  else { snake.pop(); }

  while (meshPool.length < snake.length){
    const m = new THREE.Mesh(new THREE.PlaneGeometry(CELL*0.85, CELL*0.85), bodyMat);
    m.rotation.x = -Math.PI/2;
    snakeGroup.add(m);
    meshPool.push(m);
  }
  while (meshPool.length > snake.length){
    const m = meshPool.pop();
    snakeGroup.remove(m);
  }

  const idx = foodItems.findIndex(f=>f.x===newHead.x && f.z===newHead.z);
  if (idx !== -1){
    const item = foodItems[idx];
    foodGroup.remove(item.mesh);
    foodItems.splice(idx,1);

    if (item.type === 'apple'){
      score += 10;
      growthPending += 1;
      moveInterval = Math.max(MIN_INTERVAL, moveInterval - INTERVAL_STEP);
      ensureApple();
      if (Math.random() < 0.22 && !foodItems.some(f=>f.type==='heart'))  spawnFoodItem('heart');
      if (Math.random() < 0.16 && !foodItems.some(f=>f.type==='shield')) spawnFoodItem('shield');
    } else if (item.type === 'heart'){
      lives += 1;
    } else if (item.type === 'shield'){
      shieldActive = true;
      shieldTimer = SHIELD_MS;
    }
  }

  updateHUD();
}

function endGame(){
  gameRunning = false;
  document.getElementById('finalScoreVal').textContent = score;
  document.getElementById('gameOverOverlay').style.display = 'flex';
}

let prevPositions = [];
function captureSnapshot(){
  prevPositions = snake.map(s=>({x:s.x, z:s.z}));
}

function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);

  if (gameRunning){
    moveAccumulator += dt*1000;

    if (shieldActive){
      shieldTimer -= dt*1000;
      if (shieldTimer <= 0){ shieldActive = false; shieldTimer = 0; }
      updateHUD();
    }

    if (moveAccumulator >= moveInterval){
      captureSnapshot();
      stepGrid();
      moveAccumulator = 0;
    }
  }

  const t = gameRunning ? Math.min(moveAccumulator / moveInterval, 1) : 1;

  for (let i=0; i<meshPool.length; i++){
    const cur = snake[i];
    const prev = prevPositions[i] || cur;
    const wx = gx(prev.x) + (gx(cur.x) - gx(prev.x)) * t;
    const wz = gz(prev.z) + (gz(cur.z) - gz(prev.z)) * t;
    const mesh = meshPool[i];
    if (mesh) {
      mesh.position.set(wx, 0.05, wz);
      mesh.material = shieldActive ? shieldGlowMat : (i===0 ? headMat : bodyMat);
    }
  }

  renderer.render(scene, camera);
}

function handleResize(){
  const wrap = document.getElementById('canvasWrap');
  if (!wrap) return;
  const size = wrap.clientHeight;
  renderer.setSize(size, size, false);
}
window.addEventListener('resize', handleResize);

document.getElementById('startBtn').addEventListener('click', ()=>{
  initAudio();
  document.getElementById('startScreen').style.display = 'none';
  document.getElementById('gameScreen').style.display = 'flex';
  resetGame();
  requestAnimationFrame(()=>{ handleResize(); });
});

document.getElementById('restartBtn').addEventListener('click', ()=>{
  initAudio();
  resetGame();
});

document.getElementById('quitBtnGame').addEventListener('click', ()=>{
  returnToMainScreen();
});

document.getElementById('quitBtnGameOver').addEventListener('click', ()=>{
  returnToMainScreen();
});

handleResize();
animate();
</script>
</body>
</html>
