<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Monorom Admin Portal</title><link rel="icon" href="logo.png"><script src="api-config.js"></script><style>
body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f7f4;color:#19332a}.top{background:#184d3a;color:white;padding:18px 24px;display:flex;justify-content:space-between;align-items:center;gap:12px;position:sticky;top:0;z-index:5}.top h1{margin:0;font-size:1.35rem}.top button{border:1px solid rgba(255,255,255,.4);background:transparent;color:#fff;border-radius:10px;padding:9px 13px;cursor:pointer}.wrap{max-width:1250px;margin:auto;padding:24px}.overview{margin-bottom:24px}.overview-head{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-bottom:14px}.overview-head h2{margin:0;font-size:1.2rem}.overview-head p{margin:0;color:#64746c;font-size:.88rem}.progress-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.progress-card{background:#fff;border-radius:16px;padding:18px;box-shadow:0 5px 20px rgba(0,0,0,.06);border:1px solid #e4ece6}.progress-user{display:flex;justify-content:space-between;align-items:start;gap:10px;margin-bottom:15px}.progress-user h3{margin:0;font-size:1.05rem}.progress-user small{color:#68786f}.progress-badge{font-size:.78rem;color:#236b51;background:#edf7f1;padding:5px 8px;border-radius:999px;white-space:nowrap}.metric{margin:10px 0}.metric-row{display:flex;justify-content:space-between;gap:8px;font-size:.82rem;margin-bottom:5px}.metric-row span:last-child{font-weight:700}.track{height:9px;background:#edf1ee;border-radius:999px;overflow:hidden}.fill{height:100%;width:0;background:#2d7056;border-radius:999px;transition:width .3s ease}.mini-chart{display:flex;align-items:end;gap:7px;height:72px;padding:8px 0 0}.day-col{flex:1;height:100%;display:flex;flex-direction:column;justify-content:end;align-items:center;gap:4px}.day-bar{width:100%;max-width:22px;min-height:3px;background:#7ba892;border-radius:5px 5px 2px 2px}.day-label{font-size:.64rem;color:#84918b}.no-data{color:#7b8882;font-size:.85rem;padding:12px 0}.table-title{margin:28px 0 12px;font-size:1.1rem}.table-wrap{overflow:auto;background:#fff;border-radius:16px;box-shadow:0 5px 20px rgba(0,0,0,.06)}table{width:100%;border-collapse:collapse;min-width:760px}th,td{padding:13px 14px;border-bottom:1px solid #e6ece8;text-align:left;vertical-align:top}th{background:#f0f5f1;font-size:.88rem}.btn{border:0;background:#2d7056;color:#fff;border-radius:9px;padding:8px 11px;cursor:pointer}.details{display:none;background:#f8fbf8}.details.open{display:table-row}.panel{display:grid;grid-template-columns:1fr 1fr;gap:18px;padding:8px}.box{background:white;border:1px solid #dfe9e2;border-radius:12px;padding:14px}.box h3{margin-top:0}.event{padding:9px 0;border-bottom:1px solid #edf1ee;font-size:.9rem}.json{white-space:pre-wrap;word-break:break-word;background:#f5f7f5;padding:10px;border-radius:8px;font-size:.78rem;max-height:260px;overflow:auto}.bar{display:flex;gap:10px;align-items:center;margin-bottom:15px}.game-chart{background:#fbfdfb;border:1px solid #dfe9e2;border-radius:12px;padding:14px;margin:0 0 16px}.game-chart h3{margin:0 0 4px;font-size:1rem}.game-chart-sub{color:#718078;font-size:.78rem;margin-bottom:8px}.game-svg{width:100%;height:220px;display:block}.game-svg text{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#65756d;font-size:10px}.game-gridline{stroke:#dce5df;stroke-width:1}.game-axis{stroke:#52635b;stroke-width:1.5}.game-line{fill:none;stroke:#4a9b83;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.game-point{fill:#fff;stroke:#4a9b83;stroke-width:3}.bar input{padding:10px 12px;border:1px solid #ccd9d0;border-radius:10px;flex:1}.status{font-size:.86rem;color:#64746c}.empty{padding:30px;text-align:center}.danger{color:#a61b1b}@media(max-width:800px){.progress-grid{grid-template-columns:1fr}.panel{grid-template-columns:1fr}.overview-head{align-items:start;flex-direction:column}}
</style></head><body><header class="top"><h1>Monorom Admin Portal</h1><div><span id="status">Loading…</span> <button id="refresh">Refresh</button><button id="logout">Logout</button></div></header><main class="wrap">
<section class="overview"><div class="overview-head"><div><h2>Visual Progress Overview</h2><p>Progress is calculated from the activities and data recorded by each user.</p></div><span id="userSummary" class="status"></span></div><div id="progressGrid" class="progress-grid"><div class="progress-card no-data">Loading progress…</div></div></section>
<h2 class="table-title">User records</h2><div class="bar"><input id="search" placeholder="Search users by name or mobile"><span class="status">Live data when online; last cached dashboard when offline.</span></div><div class="table-wrap"><table><thead><tr><th>User</th><th>Mobile</th><th>Language</th><th>Last seen</th><th>Data keys</th><th>Activities</th><th></th></tr></thead><tbody id="users"><tr><td colspan="7" class="empty">Loading…</td></tr></tbody></table></div></main>
<script>
const API=(window.MONOROM_API_URL||'http://localhost:5000/api').replace(/\/$/,''); const token=()=>localStorage.getItem('monorom_admin_token')||''; let dashboard=null;
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function clamp(n,min=0,max=100){return Math.max(min,Math.min(max,n))}
function getLog(x){
  const stored=x?.data?.monorom_progress_log?.value;
  if(Array.isArray(stored)) return stored;
  return (x?.activities||[]).map(e=>({type:e.type,data:e.data||{},at:e.createdAt}));
}
function getStored(x,key,fallback){const v=x?.data?.[key]?.value;return v==null?fallback:v}
function gameSeries(x){
  const log=getLog(x).filter(e=>e.type==='game_completed');
  const days=[]; const now=new Date();
  for(let i=6;i>=0;i--){
    const d=new Date(now); d.setHours(0,0,0,0); d.setDate(d.getDate()-i);
    const key=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    const count=log.filter(e=>{
      const raw=e.data?.date||e.at;
      if(e.data?.date) return String(raw).slice(0,10)===key;
      return new Date(raw).toLocaleDateString('en-CA')===key;
    }).length;
    days.push({key,label:d.toLocaleDateString(undefined,{day:'2-digit',month:'short'}),count});
  }
  return days;
}
function gameChart(x){
  const pts=gameSeries(x), w=620,h=220,padL=42,padR=18,padT=16,padB=34;
  const max=Math.max(1,...pts.map(p=>p.count));
  const xAt=i=>padL+(i*(w-padL-padR)/Math.max(1,pts.length-1));
  const yAt=v=>padT+(h-padT-padB)-(v/max)*(h-padT-padB);
  const line=pts.map((p,i)=>`${xAt(i).toFixed(1)},${yAt(p.count).toFixed(1)}`).join(' ');
  const grid=Array.from({length:4},(_,i)=>{
    const v=Math.round(max*(i/3)); const y=yAt(v);
    return `<line class="game-gridline" x1="${padL}" y1="${y}" x2="${w-padR}" y2="${y}"/><text x="${padL-8}" y="${y+3}" text-anchor="end">${v}</text>`;
  }).join('');
  const labels=pts.map((p,i)=>`<text x="${xAt(i)}" y="${h-10}" text-anchor="middle">${esc(p.label)}</text>`).join('');
  const points=pts.map((p,i)=>`<circle class="game-point" cx="${xAt(i)}" cy="${yAt(p.count)}" r="5"><title>${p.count} game session${p.count===1?'':'s'} on ${p.label}</title></circle>`).join('');
  const total=pts.reduce((a,p)=>a+p.count,0);
  return `<div class="game-chart"><h3>Brain-exercise game activity</h3><div class="game-chart-sub">Completed game sessions only · last 7 days · total ${total}</div><svg class="game-svg" viewBox="0 0 ${w} ${h}" role="img" aria-label="Brain exercise completed game sessions over the last 7 days">${grid}<line class="game-axis" x1="${padL}" y1="${padT}" x2="${padL}" y2="${h-padB}"/><line class="game-axis" x1="${padL}" y1="${h-padB}" x2="${w-padR}" y2="${h-padB}"/><polyline class="game-line" points="${line}"/>${points}${labels}</svg></div>`;
}
function metrics(x){
  const log=getLog(x); const routine=getStored(x,'routine_activities',{}); const done=Object.values(routine||{}).filter(v=>v&&v.done).length; const routinePct=clamp((done/12)*100);
  const medEvents=log.filter(e=>e.type==='medicine_taken'||e.type==='medicine_missed'); const medTaken=log.filter(e=>e.type==='medicine_taken').length; const medMissed=log.filter(e=>e.type==='medicine_missed').length; const medPct=medEvents.length?clamp(medTaken/(medTaken+medMissed)*100):0;
  const games=log.filter(e=>e.type==='game_completed'); const gamePct=clamp(games.length?Math.min(100,20+games.length*12):0);
  const family=getStored(x,'famdoc_family',[]); const doctors=getStored(x,'famdoc_doctors',[]); const contacts=(Array.isArray(family)?family.length:0)+(Array.isArray(doctors)?doctors.length:0); const contactPct=clamp(contacts*25);
  const days=[]; const now=new Date(); for(let i=6;i>=0;i--){const d=new Date(now);d.setHours(0,0,0,0);d.setDate(d.getDate()-i);const key=d.toISOString().slice(0,10);const count=log.filter(e=>String(e.at||'').slice(0,10)===key).length;days.push({label:d.toLocaleDateString(undefined,{weekday:'short'}).slice(0,2),count});}
  return {routinePct,medPct,gamePct,contactPct,games,days,done,contacts};
}
function bar(label,pct,detail){return `<div class="metric"><div class="metric-row"><span>${label}</span><span>${detail||Math.round(pct)+'%'}</span></div><div class="track"><div class="fill" style="width:${Math.round(pct)}%"></div></div></div>`}
function progressCard(x){const u=x.user,m=metrics(x);const max=Math.max(1,...m.days.map(d=>d.count));return `<article class="progress-card"><div class="progress-user"><div><h3>${esc(u.name)}</h3><small>${esc(u.mobile)}</small></div><span class="progress-badge">${m.games.length} game session${m.games.length===1?'':'s'}</span></div>${gameChart(x)}${bar('Today\'s routine',m.routinePct,`${m.done}/12`)}${bar('Medication adherence',m.medPct,m.medPct?Math.round(m.medPct)+'%':'No dose data')}${bar('Memory-game activity',m.gamePct,m.games.length?`${m.games.length} completed`:'No sessions yet')}${bar('Care network',m.contactPct,`${m.contacts} contact${m.contacts===1?'':'s'}`)}<div class="metric-row" style="margin-top:16px"><span>Activity — last 7 days</span><span>${m.days.reduce((a,b)=>a+b.count,0)} events</span></div><div class="mini-chart">${m.days.map(d=>`<div class="day-col" title="${d.count} events"><div class="day-bar" style="height:${Math.max(4,Math.round((d.count/max)*58))}px"></div><div class="day-label">${esc(d.label)}</div></div>`).join('')}</div></article>`}
function renderProgress(){const grid=document.getElementById('progressGrid');const users=dashboard?.users||[];document.getElementById('userSummary').textContent=`${users.length} user${users.length===1?'':'s'} tracked`;grid.innerHTML=users.length?users.map(progressCard).join(''):'<div class="progress-card no-data">No user data available yet.</div>'}
async function fetchDash(){if(!navigator.onLine){const c=localStorage.getItem('monorom_admin_cache');if(c){dashboard=JSON.parse(c);render();status.textContent='Offline • cached';return}status.textContent='Offline • no cache';return} const r=await fetch(API+'/admin/dashboard',{headers:{Authorization:'Bearer '+token()}});const d=await r.json();if(!r.ok)throw new Error(d.error||'Unable to load admin data');dashboard=d;localStorage.setItem('monorom_admin_cache',JSON.stringify(d));status.textContent='Online • live';render()}
function render(){renderProgress();const q=search.value.trim().toLowerCase();const users=(dashboard?.users||[]).filter(x=>!q||x.user.name.toLowerCase().includes(q)||x.user.mobile.includes(q));usersEl.innerHTML=users.length?users.map((x,i)=>{const u=x.user;return `<tr><td><strong>${esc(u.name)}</strong><br><small>${esc(u.email||'')}</small></td><td>${esc(u.mobile)}</td><td>${esc(u.language)}</td><td>${u.lastSeenAt?new Date(u.lastSeenAt).toLocaleString():'Never'}</td><td>${Object.keys(x.data||{}).length}</td><td>${(x.activities||[]).length}</td><td><button class="btn" onclick="toggle(${i})">View data</button></td></tr><tr id="detail-${i}" class="details"><td colspan="7"><div class="panel"><div class="box">${gameChart(x)}<h3>${esc(u.name)} — Stored data</h3>${Object.keys(x.data||{}).length?Object.entries(x.data).map(([k,v])=>`<div class="event"><strong>${esc(k)}</strong><div class="json">${esc(JSON.stringify(v.value,null,2))}</div></div>`).join(''):'<div>No stored data yet.</div>'}</div><div class="box"><h3>Activity history</h3>${(x.activities||[]).length?(x.activities||[]).slice(0,50).map(e=>`<div class="event"><strong>${esc(e.type)}</strong> — ${new Date(e.createdAt).toLocaleString()}<div class="json">${esc(JSON.stringify(e.data,null,2))}</div></div>`).join(''):'<div>No activity events yet.</div>'}<h3>Emergency alerts</h3>${(x.emergencies||[]).length?(x.emergencies||[]).map(a=>`<div class="event"><strong class="danger">${esc(a.status)}</strong> — ${new Date(a.createdAt).toLocaleString()}<div>${esc(JSON.stringify(a.location||null))}</div></div>`).join(''):'<div>No emergency alerts.</div>'}</div></div></td></tr>`}).join(''):'<tr><td colspan="7" class="empty">No users match your search.</td></tr>'}
function toggle(i){document.getElementById('detail-'+i).classList.toggle('open')}
const usersEl=document.getElementById('users');search.oninput=render;refresh.onclick=()=>fetchDash().catch(e=>status.textContent=e.message);logout.onclick=()=>{localStorage.removeItem('monorom_admin_token');location.href='login.html'};window.addEventListener('online',()=>fetchDash().catch(()=>{}));fetchDash().catch(e=>{status.textContent=e.message;const c=localStorage.getItem('monorom_admin_cache');if(c){dashboard=JSON.parse(c);renderProgress();render()} });
</script></body></html>
