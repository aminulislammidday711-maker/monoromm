<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Monorom Admin Portal</title><link rel="icon" href="logo.png"><script src="api-config.js"></script><style>
body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f7f4;color:#19332a}.top{background:#184d3a;color:white;padding:18px 24px;display:flex;justify-content:space-between;align-items:center;gap:12px;position:sticky;top:0;z-index:5}.top h1{margin:0;font-size:1.35rem}.top button{border:1px solid rgba(255,255,255,.4);background:transparent;color:#fff;border-radius:10px;padding:9px 13px;cursor:pointer}.wrap{max-width:1250px;margin:auto;padding:24px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:20px}.stat{background:#fff;border-radius:16px;padding:18px;box-shadow:0 5px 20px rgba(0,0,0,.06)}.stat strong{display:block;font-size:2rem}.table-wrap{overflow:auto;background:#fff;border-radius:16px;box-shadow:0 5px 20px rgba(0,0,0,.06)}table{width:100%;border-collapse:collapse;min-width:760px}th,td{padding:13px 14px;border-bottom:1px solid #e6ece8;text-align:left;vertical-align:top}th{background:#f0f5f1;font-size:.88rem}.online{color:#18794e}.offline{color:#8a5a00}.btn{border:0;background:#2d7056;color:#fff;border-radius:9px;padding:8px 11px;cursor:pointer}.details{display:none;background:#f8fbf8}.details.open{display:table-row}.panel{display:grid;grid-template-columns:1fr 1fr;gap:18px;padding:8px}.box{background:white;border:1px solid #dfe9e2;border-radius:12px;padding:14px}.box h3{margin-top:0}.event{padding:9px 0;border-bottom:1px solid #edf1ee;font-size:.9rem}.json{white-space:pre-wrap;word-break:break-word;background:#f5f7f5;padding:10px;border-radius:8px;font-size:.78rem;max-height:260px;overflow:auto}.bar{display:flex;gap:10px;align-items:center;margin-bottom:15px}.bar input{padding:10px 12px;border:1px solid #ccd9d0;border-radius:10px;flex:1}.status{font-size:.86rem;color:#64746c}.empty{padding:30px;text-align:center}.danger{color:#a61b1b}@media(max-width:800px){.stats{grid-template-columns:1fr}.panel{grid-template-columns:1fr}}
</style></head><body><header class="top"><h1>Monorom Admin Portal</h1><div><span id="status">Loading…</span> <button id="refresh">Refresh</button><button id="logout">Logout</button></div></header><main class="wrap"><div class="stats"><div class="stat"><span>Total users</span><strong id="count">—</strong></div><div class="stat"><span>Stored user records</span><strong id="records">—</strong></div><div class="stat"><span>Emergency alerts</span><strong id="alerts">—</strong></div></div><div class="bar"><input id="search" placeholder="Search users by name or mobile"><span class="status">Live data when online; last cached dashboard when offline.</span></div><div class="table-wrap"><table><thead><tr><th>User</th><th>Mobile</th><th>Language</th><th>Last seen</th><th>Data keys</th><th>Activities</th><th></th></tr></thead><tbody id="users"><tr><td colspan="7" class="empty">Loading…</td></tr></tbody></table></div></main>
<script>
const API=(window.MONOROM_API_URL||'http://localhost:5000/api').replace(/\/$/,''); const token=()=>localStorage.getItem('monorom_admin_token')||''; let dashboard=null;
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function fetchDash(){if(!navigator.onLine){const c=localStorage.getItem('monorom_admin_cache');if(c){dashboard=JSON.parse(c);render();status.textContent='Offline • cached';return}status.textContent='Offline • no cache';return} const r=await fetch(API+'/admin/dashboard',{headers:{Authorization:'Bearer '+token()}});const d=await r.json();if(!r.ok)throw new Error(d.error||'Unable to load admin data');dashboard=d;localStorage.setItem('monorom_admin_cache',JSON.stringify(d));status.textContent='Online • live';render()}
function render(){const q=search.value.trim().toLowerCase();const users=(dashboard?.users||[]).filter(x=>!q||x.user.name.toLowerCase().includes(q)||x.user.mobile.includes(q));count.textContent=dashboard?.count??0;records.textContent=(dashboard?.users||[]).reduce((n,u)=>n+Object.keys(u.data||{}).length,0);alerts.textContent=(dashboard?.users||[]).reduce((n,u)=>n+(u.emergencies||[]).length,0);usersEl.innerHTML=users.length?users.map((x,i)=>{const u=x.user;return `<tr><td><strong>${esc(u.name)}</strong><br><small>${esc(u.email||'')}</small></td><td>${esc(u.mobile)}</td><td>${esc(u.language)}</td><td>${u.lastSeenAt?new Date(u.lastSeenAt).toLocaleString():'Never'}</td><td>${Object.keys(x.data||{}).length}</td><td>${(x.activities||[]).length}</td><td><button class="btn" onclick="toggle(${i})">View data</button></td></tr><tr id="detail-${i}" class="details"><td colspan="7"><div class="panel"><div class="box"><h3>${esc(u.name)} — Stored data</h3>${Object.keys(x.data||{}).length?Object.entries(x.data).map(([k,v])=>`<div class="event"><strong>${esc(k)}</strong><div class="json">${esc(JSON.stringify(v.value,null,2))}</div></div>`).join(''):'<div>No stored data yet.</div>'}</div><div class="box"><h3>Activity history</h3>${(x.activities||[]).length?(x.activities||[]).slice(0,50).map(e=>`<div class="event"><strong>${esc(e.type)}</strong> — ${new Date(e.createdAt).toLocaleString()}<div class="json">${esc(JSON.stringify(e.data,null,2))}</div></div>`).join(''):'<div>No activity events yet.</div>'}<h3>Emergency alerts</h3>${(x.emergencies||[]).length?(x.emergencies||[]).map(a=>`<div class="event"><strong class="danger">${esc(a.status)}</strong> — ${new Date(a.createdAt).toLocaleString()}<div>${esc(JSON.stringify(a.location||null))}</div></div>`).join(''):'<div>No emergency alerts.</div>'}</div></div></td></tr>`}).join(''):'<tr><td colspan="7" class="empty">No users match your search.</td></tr>'}
function toggle(i){document.getElementById('detail-'+i).classList.toggle('open')}
const usersEl=document.getElementById('users');search.oninput=render;refresh.onclick=()=>fetchDash().catch(e=>status.textContent=e.message);logout.onclick=()=>{localStorage.removeItem('monorom_admin_token');location.href='login.html'};window.addEventListener('online',()=>fetchDash().catch(()=>{}));fetchDash().catch(e=>{status.textContent=e.message;const c=localStorage.getItem('monorom_admin_cache');if(c){dashboard=JSON.parse(c);render()}});
</script></body></html>
