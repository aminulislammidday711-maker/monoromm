<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monorom — Login</title>
<link rel="icon" href="logo.png">
<style>
:root{--forest:#184d3a;--forest2:#2d7056;--cream:#f7f3e8;--ink:#19332a;--soft:#6b7d75;--danger:#b42318}
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(135deg,#edf6ef,#f8f2e5);color:var(--ink);display:flex;align-items:center;justify-content:center;padding:24px}
.auth-card{width:min(460px,100%);background:#fff;border-radius:28px;padding:32px;box-shadow:0 20px 60px rgba(24,77,58,.16);border:1px solid rgba(24,77,58,.12)}
.logo{text-align:center}.logo img{width:92px;height:92px;object-fit:contain}.brand{text-align:center;font-weight:800;font-size:2rem;color:var(--forest);margin:4px 0}.sub{text-align:center;color:var(--soft);margin:0 0 24px}.language{display:flex;align-items:center;gap:10px;background:#f4f8f4;padding:10px 12px;border-radius:14px;margin-bottom:18px}.language label{font-weight:700;font-size:.9rem}.language select{margin-left:auto;border:1px solid #cbd8d0;border-radius:10px;padding:9px;background:white;font-size:1rem}
.tabs{display:flex;gap:8px;margin-bottom:18px}.tab{flex:1;padding:11px;border:1px solid #d4dfd8;background:#fff;border-radius:12px;font-weight:700;cursor:pointer}.tab.active{background:var(--forest);color:#fff;border-color:var(--forest)}
form{display:grid;gap:12px}label{font-weight:700;font-size:.92rem}input{width:100%;padding:13px 14px;border:1px solid #cbd8d0;border-radius:12px;font-size:1rem}input:focus,select:focus{outline:3px solid rgba(45,112,86,.15);border-color:var(--forest2)}button.primary{border:0;background:var(--forest);color:#fff;padding:14px;border-radius:13px;font-weight:800;font-size:1rem;cursor:pointer}button.primary:disabled{opacity:.6}.error{background:#fff1f0;color:var(--danger);padding:10px 12px;border-radius:10px;font-size:.9rem}.hint{text-align:center;color:var(--soft);font-size:.82rem;margin:16px 0 0}.admin-note{background:#fff8df;border:1px solid #eadb9b;padding:10px 12px;border-radius:12px;color:#665312;font-size:.85rem;margin-bottom:12px}.hidden{display:none!important}.connection{text-align:center;font-size:.8rem;color:var(--soft);margin-top:14px}.register-link{border:0;background:none;color:var(--forest2);font-weight:700;cursor:pointer;margin:auto}
</style>
<script src="api-config.js"></script>
</head>
<body>
<div class="auth-card">
  <div class="logo"><img src="logo.png" alt="Monorom"></div>
  <div class="brand">Monorom</div>
  <p class="sub" data-t="subtitle">Memory Companion</p>
  <div class="language"><label for="language" data-t="language">Language</label><select id="language"><option value="en">English</option><option value="bn">বাংলা</option><option value="hi">हिन्दी</option><option value="as">অসমীয়া</option></select></div>
  <div class="tabs"><button class="tab active" id="userTab" data-t="userLogin">User Login</button><button class="tab" id="adminTab" data-t="admin">Admin</button></div>
  <section id="userPanel">
    <h2 data-t="welcome">Welcome Back</h2><p class="sub" data-t="userSub">Sign in to continue to your personal Monorom space.</p>
    <form id="loginForm"><div><label for="mobile" data-t="mobile">Mobile Number</label><input id="mobile" required autocomplete="username" inputmode="tel"></div><div><label for="password" data-t="password">Password</label><input id="password" type="password" required autocomplete="current-password"></div><div id="loginError" class="error hidden"></div><button class="primary" id="loginBtn" data-t="login">Login</button></form>
    <button class="register-link" id="registerBtn" data-t="createAccount">Create a new account</button>
  </section>
  <section id="adminPanel" class="hidden">
    <div class="admin-note" data-t="adminNote">Administrator access is separate from user accounts.</div>
    <h2 data-t="adminTitle">Admin Portal</h2>
    <form id="adminForm"><div><label for="adminUser" data-t="adminUsername">Admin username</label><input id="adminUser" value="admin" required></div><div><label for="adminPassword" data-t="adminPassword">Admin password</label><input id="adminPassword" type="password" required></div><div id="adminError" class="error hidden"></div><button class="primary" id="adminBtn" data-t="adminLogin">Open Admin Portal</button></form>
  </section>
  <div id="registerPanel" class="hidden"><h2 data-t="registerTitle">Create Account</h2><form id="registerForm"><div><label for="rName" data-t="name">Name</label><input id="rName" required></div><div><label for="rMobile" data-t="mobile">Mobile Number</label><input id="rMobile" required></div><div><label for="rEmail" data-t="email">Email</label><input id="rEmail" type="email"></div><div><label for="rPassword" data-t="password">Password</label><input id="rPassword" type="password" minlength="6" required></div><div id="registerError" class="error hidden"></div><button class="primary" data-t="register">Register</button></form></div>
  <div class="connection" id="connection">● Offline-ready cache</div>
</div>
<script>
const API=(window.MONOROM_API_URL||'http://localhost:5000/api').replace(/\/$/,'');
const T={en:{subtitle:'Memory Companion',language:'Language',userLogin:'User Login',admin:'Admin',welcome:'Welcome Back',userSub:'Sign in to continue to your personal Monorom space.',mobile:'Mobile Number',password:'Password',login:'Login',createAccount:'Create a new account',adminNote:'Administrator access is separate from user accounts.',adminTitle:'Admin Portal',adminUsername:'Admin username',adminPassword:'Admin password',adminLogin:'Open Admin Portal',registerTitle:'Create Account',name:'Name',email:'Email',register:'Register',bad:'Incorrect mobile number or password.',offline:'Offline-ready cache'},bn:{subtitle:'মেমোরি সঙ্গী',language:'ভাষা',userLogin:'ব্যবহারকারী লগইন',admin:'অ্যাডমিন',welcome:'স্বাগতম',userSub:'আপনার ব্যক্তিগত মনোরমে প্রবেশ করতে লগইন করুন।',mobile:'মোবাইল নম্বর',password:'পাসওয়ার্ড',login:'লগইন',createAccount:'নতুন অ্যাকাউন্ট তৈরি করুন',adminNote:'অ্যাডমিন প্রবেশাধিকার ব্যবহারকারী অ্যাকাউন্ট থেকে আলাদা।',adminTitle:'অ্যাডমিন পোর্টাল',adminUsername:'অ্যাডমিন ব্যবহারকারী নাম',adminPassword:'অ্যাডমিন পাসওয়ার্ড',adminLogin:'অ্যাডমিন পোর্টাল খুলুন',registerTitle:'অ্যাকাউন্ট তৈরি করুন',name:'নাম',email:'ইমেইল',register:'রেজিস্টার',bad:'মোবাইল নম্বর বা পাসওয়ার্ড সঠিক নয়।',offline:'অফলাইন ক্যাশ প্রস্তুত'},hi:{subtitle:'मेमोरी कंपेनियन',language:'भाषा',userLogin:'उपयोगकर्ता लॉगिन',admin:'एडमिन',welcome:'वापसी पर स्वागत है',userSub:'अपने व्यक्तिगत मनोरम स्थान में प्रवेश करें।',mobile:'मोबाइल नंबर',password:'पासवर्ड',login:'लॉगिन',createAccount:'नया खाता बनाएं',adminNote:'एडमिन प्रवेश उपयोगकर्ता खातों से अलग है।',adminTitle:'एडमिन पोर्टल',adminUsername:'एडमिन उपयोगकर्ता नाम',adminPassword:'एडमिन पासवर्ड',adminLogin:'एडमिन पोर्टल खोलें',registerTitle:'खाता बनाएं',name:'नाम',email:'ईमेल',register:'रजिस्टर',bad:'मोबाइल नंबर या पासवर्ड गलत है।',offline:'ऑफलाइन कैश तैयार'},as:{subtitle:'স্মৃতি সংগী',language:'ভাষা',userLogin:'ব্যৱহাৰকাৰী লগইন',admin:'এডমিন',welcome:'পুনৰ স্বাগতম',userSub:'আপোনাৰ ব্যক্তিগত মনোৰম স্থানত প্ৰৱেশ কৰিবলৈ লগইন কৰক।',mobile:'মোবাইল নম্বৰ',password:'পাছৱৰ্ড',login:'লগইন',createAccount:'নতুন একাউণ্ট সৃষ্টি কৰক',adminNote:'এডমিন প্ৰৱেশাধিকাৰ ব্যৱহাৰকাৰী একাউণ্টৰ পৰা পৃথক।',adminTitle:'এডমিন প’ৰ্টেল',adminUsername:'এডমিন ব্যৱহাৰকাৰী নাম',adminPassword:'এডমিন পাছৱৰ্ড',adminLogin:'এডমিন প’ৰ্টেল খোলক',registerTitle:'একাউণ্ট সৃষ্টি কৰক',name:'নাম',email:'ইমেইল',register:'পঞ্জীয়ন কৰক',bad:'মোবাইল নম্বৰ বা পাছৱৰ্ড ভুল।',offline:'অফলাইন কেশ সাজু'}};
let lang=localStorage.getItem('monorom_lang')||'en'; const langEl=document.getElementById('language'); langEl.value=lang;
function tr(){document.documentElement.lang=lang;document.querySelectorAll('[data-t]').forEach(e=>{const k=e.dataset.t;e.textContent=T[lang][k]||T.en[k]||e.textContent});document.getElementById('connection').textContent=navigator.onLine?'● Online':'● '+T[lang].offline}
langEl.addEventListener('change',()=>{lang=langEl.value;localStorage.setItem('monorom_lang',lang);tr()});tr();window.addEventListener('online',tr);window.addEventListener('offline',tr);
if('serviceWorker' in navigator) navigator.serviceWorker.register('service-worker.js').catch(()=>{});
const authKey='monorom_auth',userKey='monorom_user';
try{if(localStorage.getItem(authKey)&&localStorage.getItem(userKey))location.href='index.html'}catch{}
function err(id,msg){const e=document.getElementById(id);e.textContent=msg;e.classList.remove('hidden')}
function clearErr(id){document.getElementById(id).classList.add('hidden')}
async function post(path,body){const r=await fetch(API+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Request failed');return d}
async function hydrate(token){try{const r=await fetch(API+'/sync/pull',{headers:{Authorization:'Bearer '+token}});if(!r.ok)return;const d=await r.json();for(const row of d.data||[]){const k='monorom_u_'+JSON.parse(localStorage.getItem(userKey)).id+'__'+row.key;if(row.value===null||row.value===undefined)localStorage.removeItem(k);else localStorage.setItem(k,typeof row.value==='string'?row.value:JSON.stringify(row.value));}}catch(e){/* offline login continues with cached state */}}
async function saveLanguage(token,lang){try{await fetch(API+'/users/me',{method:'PUT',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({language:lang})})}catch(e){}}
document.getElementById('userTab').onclick=()=>{document.getElementById('userPanel').classList.remove('hidden');document.getElementById('adminPanel').classList.add('hidden');document.getElementById('registerPanel').classList.add('hidden');userTab.classList.add('active');adminTab.classList.remove('active')};
document.getElementById('adminTab').onclick=()=>{document.getElementById('userPanel').classList.add('hidden');document.getElementById('registerPanel').classList.add('hidden');document.getElementById('adminPanel').classList.remove('hidden');userTab.classList.remove('active');adminTab.classList.add('active')};
document.getElementById('registerBtn').onclick=()=>{document.getElementById('userPanel').classList.add('hidden');document.getElementById('registerPanel').classList.remove('hidden')};
document.getElementById('loginForm').onsubmit=async e=>{e.preventDefault();clearErr('loginError');const b=document.getElementById('loginBtn');b.disabled=true;try{const d=await post('/auth/login',{mobile:mobile.value.trim(),password:password.value});localStorage.setItem(authKey,d.token);localStorage.setItem(userKey,JSON.stringify(d.user));localStorage.setItem('monorom_lang',lang); await hydrate(d.token); await saveLanguage(d.token,lang); location.href='index.html'}catch(ex){err('loginError',ex.message||T[lang].bad)}finally{b.disabled=false}};
document.getElementById('adminForm').onsubmit=async e=>{e.preventDefault();clearErr('adminError');const b=document.getElementById('adminBtn');b.disabled=true;try{const d=await post('/auth/admin-login',{username:adminUser.value.trim(),password:adminPassword.value});localStorage.setItem('monorom_admin_token',d.token);location.href='admin.html'}catch(ex){err('adminError',ex.message)}finally{b.disabled=false}};
document.getElementById('registerForm').onsubmit=async e=>{e.preventDefault();clearErr('registerError');try{const d=await post('/auth/register',{name:rName.value.trim(),mobile:rMobile.value.trim(),email:rEmail.value.trim(),password:rPassword.value});localStorage.setItem(authKey,d.token);localStorage.setItem(userKey,JSON.stringify(d.user));localStorage.setItem('monorom_lang',lang);location.href='index.html'}catch(ex){err('registerError',ex.message)} };
</script>
</body></html>
